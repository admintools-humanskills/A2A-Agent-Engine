<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 4 - Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #ffffff;
    color: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .slide {
    width: 1280px; height: 720px;
    background: #ffffff;
    border-radius: 16px; border: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }
  .header {
    padding: 40px 60px 0;
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .tag {
    display: inline-block; padding: 4px 14px;
    background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.3);
    border-radius: 16px; border: 1px solid #e5e7eb; font-size: 0.75rem; font-weight: 600; color: #7c3aed;
    text-transform: uppercase; letter-spacing: 1px;
  }
  h2 {
    font-size: 1.7rem; font-weight: 800;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .diagram-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-bar {
    position: absolute; bottom: 20px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 2;
  }
  .nav-bar a { color: #555588; text-decoration: none; font-size: 0.8rem; padding: 6px 14px; border-radius: 6px; transition: all 0.2s; }
  .nav-bar a:hover { color: #7c3aed; background: rgba(124,58,237,0.1); }
  .slide-counter { color: #999999; font-size: 0.8rem; font-weight: 500; }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <div class="tag">Architecture</div>
    <h2>Un concierge qui orchestre 7 specialistes</h2>
  </div>

  <div class="diagram-area">
    <svg width="1100" height="540" viewBox="0 0 1100 540">
      <defs>
        <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
        </marker>
        <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
        </marker>
        <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
        </marker>
      </defs>

      <!-- Layer labels on left -->
      <text x="15" y="75" fill="#999999" font-family="Inter" font-size="9" font-weight="600" transform="rotate(-90,15,75)" text-anchor="middle">CLIENT</text>
      <text x="15" y="225" fill="#999999" font-family="Inter" font-size="9" font-weight="600" transform="rotate(-90,15,225)" text-anchor="middle">BACKEND</text>
      <text x="15" y="410" fill="#999999" font-family="Inter" font-size="9" font-weight="600" transform="rotate(-90,15,410)" text-anchor="middle">AGENTS</text>

      <!-- Horizontal separator lines -->
      <line x1="40" y1="140" x2="1080" y2="140" stroke="#e0e0e8" stroke-width="1" stroke-dasharray="6,4"/>
      <line x1="40" y1="310" x2="1080" y2="310" stroke="#e0e0e8" stroke-width="1" stroke-dasharray="6,4"/>

      <!-- USER -->
      <rect x="60" y="40" width="160" height="75" rx="12" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1.5"/>
      <text x="140" y="68" text-anchor="middle" fill="#ea580c" font-family="Inter" font-size="13" font-weight="700">Utilisateur</text>
      <text x="140" y="90" text-anchor="middle" fill="#666688" font-family="Inter" font-size="9">Requete en langage naturel</text>
      <text x="140" y="105" text-anchor="middle" fill="#f97316" font-family="Inter" font-size="18">&#128100;</text>

      <!-- Arrow to Pixel UI -->
      <line x1="220" y1="78" x2="290" y2="78" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)"/>

      <!-- PIXEL ART UI -->
      <rect x="300" y="40" width="200" height="75" rx="12" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1.5"/>
      <text x="400" y="65" text-anchor="middle" fill="#ea580c" font-family="Inter" font-size="12" font-weight="700">Pixel Art UI</text>
      <text x="400" y="83" text-anchor="middle" fill="#666688" font-family="Inter" font-size="9">Canvas + Chat</text>
      <text x="400" y="103" text-anchor="middle" fill="#777799" font-family="monospace" font-size="8">WebSocket</text>

      <!-- Arrow to FastAPI -->
      <line x1="400" y1="115" x2="400" y2="165" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
      <text x="415" y="148" fill="#555588" font-family="Inter" font-size="8">WS</text>

      <!-- FASTAPI BACKEND -->
      <rect x="280" y="170" width="240" height="110" rx="12" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="400" y="197" text-anchor="middle" fill="#6d28d9" font-family="Inter" font-size="12" font-weight="700">FastAPI Backend</text>
      <text x="400" y="217" text-anchor="middle" fill="#666688" font-family="Inter" font-size="9">pixel_ui_server.py</text>

      <!-- Vertex AI box inside -->
      <rect x="305" y="230" width="190" height="36" rx="6" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="400" y="248" text-anchor="middle" fill="#7c3aed" font-family="Inter" font-size="9" font-weight="600">Vertex AI Agent Engine</text>
      <text x="400" y="260" text-anchor="middle" fill="#777799" font-family="Inter" font-size="7.5">Concierge ADK + Gemini 2.5 Flash</text>

      <!-- A2A Protocol zone -->
      <rect x="60" y="320" width="1020" height="200" rx="14" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="570" y="345" text-anchor="middle" fill="#3b82f6" font-family="Inter" font-size="11" font-weight="700">A2A Protocol &mdash; Cloud Run Services</text>

      <!-- Arrow from backend to agents zone -->
      <line x1="400" y1="280" x2="400" y2="320" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <text x="415" y="305" fill="#3b82f6" font-family="Inter" font-size="8" font-weight="500">A2A</text>

      <!-- 7 Agent boxes -->
      <!-- Hotel -->
      <rect x="80" y="365" width="120" height="70" rx="8" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="140" y="388" text-anchor="middle" fill="#2563eb" font-family="Inter" font-size="10" font-weight="600">Hotel</text>
      <text x="140" y="405" text-anchor="middle" fill="#555588" font-family="Inter" font-size="8">LangGraph</text>
      <text x="140" y="425" text-anchor="middle" fill="#1a1a2e" font-size="16">&#127976;</text>

      <!-- Vol -->
      <rect x="220" y="365" width="120" height="70" rx="8" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="280" y="388" text-anchor="middle" fill="#2563eb" font-family="Inter" font-size="10" font-weight="600">Vol</text>
      <text x="280" y="405" text-anchor="middle" fill="#555588" font-family="Inter" font-size="8">CrewAI</text>
      <text x="280" y="425" text-anchor="middle" fill="#1a1a2e" font-size="16">&#9992;</text>

      <!-- Train -->
      <rect x="360" y="365" width="120" height="70" rx="8" fill="rgba(249,115,22,0.1)" stroke="#f97316" stroke-width="1.2"/>
      <text x="420" y="388" text-anchor="middle" fill="#ea580c" font-family="Inter" font-size="10" font-weight="600">Train</text>
      <text x="420" y="405" text-anchor="middle" fill="#555588" font-family="Inter" font-size="8">LangGraph</text>
      <text x="420" y="425" text-anchor="middle" fill="#1a1a2e" font-size="16">&#128646;</text>

      <!-- Events -->
      <rect x="500" y="365" width="120" height="70" rx="8" fill="rgba(249,115,22,0.1)" stroke="#f97316" stroke-width="1.2"/>
      <text x="560" y="388" text-anchor="middle" fill="#ea580c" font-family="Inter" font-size="10" font-weight="600">Events</text>
      <text x="560" y="405" text-anchor="middle" fill="#555588" font-family="Inter" font-size="8">CrewAI</text>
      <text x="560" y="425" text-anchor="middle" fill="#1a1a2e" font-size="16">&#127915;</text>

      <!-- Restaurant -->
      <rect x="640" y="365" width="120" height="70" rx="8" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1.2"/>
      <text x="700" y="388" text-anchor="middle" fill="#059669" font-family="Inter" font-size="10" font-weight="600">Restaurant</text>
      <text x="700" y="405" text-anchor="middle" fill="#555588" font-family="Inter" font-size="8">Google GenAI</text>
      <text x="700" y="425" text-anchor="middle" fill="#1a1a2e" font-size="16">&#127869;</text>

      <!-- Boutique -->
      <rect x="780" y="365" width="120" height="70" rx="8" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1.2"/>
      <text x="840" y="388" text-anchor="middle" fill="#059669" font-family="Inter" font-size="10" font-weight="600">Boutique</text>
      <text x="840" y="405" text-anchor="middle" fill="#555588" font-family="Inter" font-size="8">Google GenAI</text>
      <text x="840" y="425" text-anchor="middle" fill="#1a1a2e" font-size="16">&#128717;</text>

      <!-- Assurance -->
      <rect x="920" y="365" width="120" height="70" rx="8" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1.2"/>
      <text x="980" y="388" text-anchor="middle" fill="#059669" font-family="Inter" font-size="10" font-weight="600">Assurance</text>
      <text x="980" y="405" text-anchor="middle" fill="#555588" font-family="Inter" font-size="8">Google GenAI</text>
      <text x="980" y="425" text-anchor="middle" fill="#1a1a2e" font-size="16">&#128737;</text>

      <!-- Connection lines from concierge to agents -->
      <g opacity="0.3">
        <line x1="400" y1="320" x2="140" y2="365" stroke="#3b82f6" stroke-width="1"/>
        <line x1="400" y1="320" x2="280" y2="365" stroke="#3b82f6" stroke-width="1"/>
        <line x1="400" y1="320" x2="420" y2="365" stroke="#f97316" stroke-width="1"/>
        <line x1="400" y1="320" x2="560" y2="365" stroke="#f97316" stroke-width="1"/>
        <line x1="400" y1="320" x2="700" y2="365" stroke="#10b981" stroke-width="1"/>
        <line x1="400" y1="320" x2="840" y2="365" stroke="#10b981" stroke-width="1"/>
        <line x1="400" y1="320" x2="980" y2="365" stroke="#10b981" stroke-width="1"/>
      </g>

      <!-- Legend -->
      <g transform="translate(620, 160)">
        <text x="0" y="0" fill="#555588" font-family="Inter" font-size="9" font-weight="600">FRAMEWORKS</text>
        <rect x="0" y="12" width="10" height="10" rx="2" fill="rgba(59,130,246,0.3)"/>
        <text x="16" y="21" fill="#2563eb" font-family="Inter" font-size="9">LangGraph</text>
        <rect x="90" y="12" width="10" height="10" rx="2" fill="rgba(249,115,22,0.3)"/>
        <text x="106" y="21" fill="#ea580c" font-family="Inter" font-size="9">CrewAI</text>
        <rect x="160" y="12" width="10" height="10" rx="2" fill="rgba(16,185,129,0.3)"/>
        <text x="176" y="21" fill="#059669" font-family="Inter" font-size="9">Google GenAI</text>
      </g>

      <!-- Key points -->
      <g transform="translate(620, 210)">
        <text x="0" y="0" fill="#666688" font-family="Inter" font-size="9">&#8226; Chaque agent est <tspan font-weight="600" fill="#6d28d9">stateless</tspan></text>
        <text x="0" y="18" fill="#666688" font-family="Inter" font-size="9">&#8226; Delegation <tspan font-weight="600" fill="#6d28d9">parallele</tspan> possible</text>
        <text x="0" y="36" fill="#666688" font-family="Inter" font-size="9">&#8226; Contexte complet a chaque appel</text>
      </g>

      <!-- Fancy box: key insight -->
      <rect x="620" y="258" width="260" height="32" rx="6" fill="rgba(124,58,237,0.1)" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="750" y="279" text-anchor="middle" fill="#6d28d9" font-family="Inter" font-size="9" font-weight="600">3 frameworks differents, 1 seul protocole</text>
    </svg>
  </div>

  <div class="nav-bar">
    <a href="slide-03-protocole-a2a.html">&larr; Precedent</a>
    <span class="slide-counter">4 / 9</span>
    <a href="slide-05-agents.html">Suivant &rarr;</a>
  </div>
</div>

<script>
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); window.location.href = 'slide-05-agents.html'; }
  if (e.key === 'ArrowLeft') { window.location.href = 'slide-03-protocole-a2a.html'; }
  if (e.key === 'Home') { window.location.href = 'index.html'; }
});
</script>
</body>
</html>
